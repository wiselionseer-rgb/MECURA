<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Mecura - Portal Médico</title>
    <script>
      // Prevent legacy polyfills (e.g., from formdata-polyfill or canvg) from crashing the app
      // by attempting to assign to the read-only window.fetch property.
      const originalFetch = window.fetch;
      Object.defineProperty(window, 'fetch', {
        get: function() { return originalFetch; },
        set: function(v) { console.warn("Prevented assignment to window.fetch"); },
        configurable: true
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
